name: IA Perso Web

on:
  pull_request:
    paths:
      - 'web/ia-perso/**'
      - '.github/workflows/web-image-provider.yml'
  workflow_dispatch:

concurrency:
  group: ia-perso-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web/ia-perso
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run zero-quota unit tests
        run: npm test
      - name: Validate PWA manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
