name: IA Perso CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "feat/ia-perso-*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-metadata:
    name: Compile shared metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile common Kotlin metadata
        run: ./gradlew :shared:compileKotlinMetadata --stacktrace
