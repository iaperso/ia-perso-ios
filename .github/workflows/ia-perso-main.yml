name: IA Perso Main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ia-perso-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-checks:
    name: Compile shared code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile shared metadata
        run: ./gradlew :shared:compileKotlinMetadata --stacktrace

  ios:
    name: Compile iPhone target
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile shared iOS arm64
        run: ./gradlew :shared:compileKotlinIosArm64 --stacktrace
