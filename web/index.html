<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IA Perso">
<meta name="description" content="IA Perso : un prompt, une image.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="./manifest.webmanifest?v=15">
<title>IA Perso</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#121722;--line:#293247;--text:#f5f7fb;--muted:#99a4b8;--accent:#778cff;--danger:#ff7486;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{min-height:100dvh}.app{width:min(820px,100%);min-height:100dvh;margin:auto;padding:max(22px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}h1{font-size:36px;letter-spacing:-.045em;margin:0}.sub{color:var(--muted);margin:-8px 0 4px;font-size:14px}.composer{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}textarea{width:100%;min-height:150px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:20px;line-height:1.45;padding:8px}textarea::placeholder{color:#747f93}button{border:0;border-radius:16px;background:var(--accent);color:white;font:inherit;font-size:18px;font-weight:800;padding:15px 18px}button:disabled{opacity:.45}.result{flex:1;min-height:280px;border:1px solid var(--line);border-radius:22px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.result img{display:block;width:100%;height:100%;object-fit:contain}.status{padding:24px;text-align:center;color:var(--muted);line-height:1.5}.error{color:var(--danger)}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #4e5a70;border-top-color:#dce3ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:540px){.app{padding-left:12px;padding-right:12px}h1{font-size:32px}textarea{min-height:130px;font-size:18px}.result{min-height:250px}}
</style>
</head>
<body>
<main class="app">
  <h1>IA Perso</h1>
  <p class="sub">Décris une image.</p>
  <form id="composer" class="composer">
    <textarea id="prompt" autocomplete="off" placeholder="Ex. Une maison dans la montagne au coucher du soleil"></textarea>
    <button id="generate" type="submit">Générer l’image</button>
  </form>
  <section id="result" class="result" aria-live="polite"><div class="status">Ton image apparaîtra ici.</div></section>
</main>
<script type="module">
import { generateHorde } from './providers.js?v=15';

const promptEl=document.getElementById('prompt');
const button=document.getElementById('generate');
const resultEl=document.getElementById('result');
let busy=false;
let workflow=null;
try{workflow=JSON.parse(localStorage.getItem('ia-perso-comfy-workflow')||'null')}catch{workflow=null}
const comfyUrl=(localStorage.getItem('ia-perso-comfy-url')||'').trim();
const hfToken=(localStorage.getItem('ia-perso-hf-token')||'').trim();

function status(text,error=false){resultEl.innerHTML='';const d=document.createElement('div');d.className='status'+(error?' error':'');d.textContent=text;resultEl.appendChild(d)}
function loading(text){resultEl.innerHTML='';const d=document.createElement('div');d.className='status';const s=document.createElement('span');s.className='spinner';d.appendChild(s);d.appendChild(document.createTextNode(text));resultEl.appendChild(d)}
function showImage(url){resultEl.innerHTML='';const img=document.createElement('img');img.src=url;img.alt=promptEl.value.trim();img.loading='eager';img.addEventListener('error',()=>status('L’image a été créée mais son chargement a échoué. Réessaie.',true),{once:true});resultEl.appendChild(img)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function normalizeBase(value){return value.replace(/\/+$/,'')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function prepareWorkflow(promptText,size=768){const w=clone(workflow);let positiveSet=false;for(const [,node] of Object.entries(w)){if(!node||typeof node!=='object')continue;const type=node.class_type||'';const title=(node._meta?.title||'').toLowerCase();if(type==='CLIPTextEncode'&&node.inputs){if(title.includes('positive')||(!positiveSet&&!title.includes('negative'))){node.inputs.text=promptText;positiveSet=true}}if(type==='EmptyLatentImage'&&node.inputs){node.inputs.width=Number(size);node.inputs.height=Number(size)}if((type==='KSampler'||type==='KSamplerAdvanced')&&node.inputs&&'seed' in node.inputs)node.inputs.seed=Math.floor(Math.random()*2147483647);if(type==='RandomNoise'&&node.inputs&&'noise_seed' in node.inputs)node.inputs.noise_seed=Math.floor(Math.random()*2147483647)}if(!positiveSet)throw new Error('Workflow ComfyUI incompatible.');return w}
async function fetchTimeout(url,options={},ms=20000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...options,signal:c.signal})}finally{clearTimeout(t)}}
async function generateComfy(promptText){if(!comfyUrl||!workflow)throw new Error('ComfyUI non configuré.');const base=normalizeBase(comfyUrl);loading('ComfyUI génère l’image…');const prepared=prepareWorkflow(promptText,768);const clientId=crypto.randomUUID?.()||String(Date.now());const q=await fetchTimeout(base+'/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prepared,client_id:clientId})},25000);if(!q.ok)throw new Error('ComfyUI HTTP '+q.status);const payload=await q.json();const id=payload.prompt_id;if(!id)throw new Error('ComfyUI n’a pas renvoyé de prompt_id.');const started=Date.now();while(Date.now()-started<240000){await sleep(1500);const h=await fetchTimeout(base+'/history/'+encodeURIComponent(id),{},15000);if(!h.ok)continue;const data=await h.json();const run=data[id];if(!run)continue;for(const output of Object.values(run.outputs||{})){for(const im of output.images||[]){return base+'/view?filename='+encodeURIComponent(im.filename)+'&subfolder='+encodeURIComponent(im.subfolder||'')+'&type='+encodeURIComponent(im.type||'output')}}if(run.status?.status_str==='error')throw new Error('Le workflow ComfyUI a échoué.')}throw new Error('ComfyUI a dépassé 4 minutes.')}
async function generateHF(promptText){if(!hfToken)throw new Error('Hugging Face non authentifié.');loading('Dernier essai via Hugging Face…');const {Client}=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');const options={token:hfToken};const spaces=['stabilityai/stable-diffusion-3.5-large-turbo','stabilityai/stable-diffusion-3.5-medium'];let lastErr=null;for(const space of spaces){try{const client=await Client.connect(space,options);const turbo=space.includes('turbo');const r=await client.predict('/infer',{prompt:promptText,negative_prompt:'',seed:0,randomize_seed:true,width:768,height:768,guidance_scale:turbo?0:4.5,num_inference_steps:turbo?4:28});const image=r?.data?.[0];const url=typeof image==='string'?image:(image?.url||image?.path);if(url)return url;throw new Error('Aucune image retournée.')}catch(e){lastErr=e;console.warn('HF image provider failed',space,e)}}throw lastErr||new Error('Hugging Face indisponible.')}

async function generate(promptText){
  if(comfyUrl&&workflow){try{return await generateComfy(promptText)}catch(e){console.warn('ComfyUI fallback',e)}}
  let hordeError=null;
  try{return await generateHorde(promptText,{onStatus:loading,timeoutMs:480000})}catch(e){hordeError=e;console.warn('AI Horde fallback',e)}
  if(hfToken)return await generateHF(promptText);
  throw hordeError||new Error('Le réseau gratuit est momentanément indisponible. Réessaie dans quelques instants.');
}

document.getElementById('composer').addEventListener('submit',async e=>{e.preventDefault();const text=promptEl.value.trim();if(!text||busy)return;busy=true;button.disabled=true;button.textContent='Génération…';try{const url=await generate(text);showImage(url)}catch(err){console.error(err);status('Échec de génération : '+(err?.message||String(err)),true)}finally{busy=false;button.disabled=false;button.textContent='Générer l’image'}});
</script>
</body>
</html>
