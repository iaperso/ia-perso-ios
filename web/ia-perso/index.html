<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IA Perso">
<meta name="description" content="IA Perso : un prompt, une image, trois références maximum.">
<link rel="manifest" href="/manifest.webmanifest?v=20">
<title>IA Perso</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#121722;--line:#293247;--text:#f5f7fb;--muted:#99a4b8;--accent:#778cff;--danger:#ff7486;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{min-height:100dvh}.app{width:min(820px,100%);min-height:100dvh;margin:auto;padding:max(22px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}h1{font-size:36px;letter-spacing:-.045em;margin:0}.sub{color:var(--muted);margin:-8px 0 4px;font-size:14px}.composer{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}textarea{width:100%;min-height:145px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:20px;line-height:1.45;padding:8px}textarea::placeholder{color:#747f93}.actions{display:flex;gap:10px;align-items:center}.quality{flex:0 0 auto;background:#0d1119;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit}.generate{flex:1;border:0;border-radius:16px;background:var(--accent);color:white;font:inherit;font-size:18px;font-weight:800;padding:15px 18px}.generate:disabled{opacity:.45}.result{min-height:280px;border:1px solid var(--line);border-radius:22px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.result img{display:block;width:100%;max-height:70dvh;object-fit:contain}.status{padding:24px;text-align:center;color:var(--muted);line-height:1.5}.error{color:var(--danger)}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #4e5a70;border-top-color:#dce3ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.meta{color:var(--muted);font-size:12px;text-align:center;margin-top:-10px}.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ref{display:block;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);color:var(--text);text-decoration:none;min-width:0}.ref img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#0d1119}.ref .caption{padding:8px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.refs-title{font-size:13px;color:var(--muted);margin-bottom:-8px}.hidden{display:none!important}@media(max-width:540px){.app{padding-left:12px;padding-right:12px}h1{font-size:32px}textarea{min-height:125px;font-size:18px}.result{min-height:250px}.quality{max-width:125px}.refs{gap:7px}}
</style>
</head>
<body>
<main class="app">
  <h1>IA Perso</h1>
  <p class="sub">Une demande = une seule génération · jusqu’à 3 références ouvertes.</p>
  <form id="composer" class="composer">
    <textarea id="prompt" autocomplete="off" maxlength="1800" placeholder="Ex. Une maison dans la montagne au coucher du soleil"></textarea>
    <div class="actions">
      <select id="quality" class="quality" aria-label="Qualité">
        <option value="512" selected>Éco · 512</option>
        <option value="1024">HD · 1024</option>
      </select>
      <button id="generate" class="generate" type="submit">Générer l’image</button>
    </div>
  </form>
  <section id="result" class="result" aria-live="polite"><div class="status">Ton image apparaîtra ici.</div></section>
  <div id="meta" class="meta hidden"></div>
  <div id="refsTitle" class="refs-title hidden">Références visuelles proches</div>
  <section id="refs" class="refs hidden" aria-label="Références visuelles"></section>
</main>
<script type="module">
import { findReferences, generateRemote, newRequestId } from '/providers.js?v=20';
const promptEl=document.getElementById('prompt');
const qualityEl=document.getElementById('quality');
const button=document.getElementById('generate');
const resultEl=document.getElementById('result');
const refsEl=document.getElementById('refs');
const refsTitle=document.getElementById('refsTitle');
const metaEl=document.getElementById('meta');
let busy=false;
let workflow=null;
try{workflow=JSON.parse(localStorage.getItem('ia-perso-comfy-workflow')||'null')}catch{workflow=null}
const comfyUrl=(localStorage.getItem('ia-perso-comfy-url')||'').trim();
function status(text,error=false){resultEl.innerHTML='';const d=document.createElement('div');d.className='status'+(error?' error':'');d.textContent=text;resultEl.appendChild(d)}
function loading(text){resultEl.innerHTML='';const d=document.createElement('div');d.className='status';const s=document.createElement('span');s.className='spinner';d.appendChild(s);d.appendChild(document.createTextNode(text));resultEl.appendChild(d)}
function showImage(url,alt){resultEl.innerHTML='';const img=document.createElement('img');img.src=url;img.alt=alt;img.loading='eager';img.decoding='async';img.addEventListener('error',()=>status('L’image a été créée mais son chargement a échoué.',true),{once:true});resultEl.appendChild(img)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function normalizeBase(value){return value.replace(/\/+$/,'')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function prepareWorkflow(promptText,size){const w=clone(workflow);let positiveSet=false;for(const [,node] of Object.entries(w)){if(!node||typeof node!=='object')continue;const type=node.class_type||'';const title=(node._meta?.title||'').toLowerCase();if(type==='CLIPTextEncode'&&node.inputs){if(title.includes('positive')||(!positiveSet&&!title.includes('negative'))){node.inputs.text=promptText;positiveSet=true}}if(type==='EmptyLatentImage'&&node.inputs){node.inputs.width=size;node.inputs.height=size}if((type==='KSampler'||type==='KSamplerAdvanced')&&node.inputs&&'seed' in node.inputs)node.inputs.seed=Math.floor(Math.random()*2147483647);if(type==='RandomNoise'&&node.inputs&&'noise_seed' in node.inputs)node.inputs.noise_seed=Math.floor(Math.random()*2147483647)}if(!positiveSet)throw new Error('Workflow ComfyUI incompatible.');return w}
async function fetchTimeout(url,options={},ms=20000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...options,signal:c.signal})}finally{clearTimeout(t)}}
async function generateComfy(promptText,size){const base=normalizeBase(comfyUrl);loading('ComfyUI génère l’image…');const prepared=prepareWorkflow(promptText,size);const clientId=newRequestId();const q=await fetchTimeout(base+'/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prepared,client_id:clientId})},25000);if(!q.ok)throw new Error('ComfyUI HTTP '+q.status);const payload=await q.json();const id=payload.prompt_id;if(!id)throw new Error('ComfyUI n’a pas renvoyé de prompt_id.');const started=Date.now();while(Date.now()-started<240000){await sleep(1500);const h=await fetchTimeout(base+'/history/'+encodeURIComponent(id),{},15000);if(!h.ok)continue;const data=await h.json();const run=data[id];if(!run)continue;for(const output of Object.values(run.outputs||{})){for(const im of output.images||[]){return {imageUrl:base+'/view?filename='+encodeURIComponent(im.filename)+'&subfolder='+encodeURIComponent(im.subfolder||'')+'&type='+encodeURIComponent(im.type||'output'),provider:'comfyui',model:'workflow local',size}}if(run.status?.status_str==='error')throw new Error('Le workflow ComfyUI a échoué.')}throw new Error('ComfyUI a dépassé 4 minutes.')}
function renderRefs(refs){refsEl.innerHTML='';if(!refs.length){refsEl.classList.add('hidden');refsTitle.classList.add('hidden');return}for(const ref of refs){const a=document.createElement('a');a.className='ref';a.href=ref.landingUrl;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.src=ref.thumbUrl;img.alt=ref.title;img.loading='lazy';img.decoding='async';const cap=document.createElement('div');cap.className='caption';cap.textContent=[ref.creator,ref.license].filter(Boolean).join(' · ')||ref.source;a.append(img,cap);refsEl.appendChild(a)}refsEl.classList.remove('hidden');refsTitle.classList.remove('hidden')}
async function generate(text,size,requestId){if(comfyUrl&&workflow)return generateComfy(text,size);loading(size===1024?'Création HD…':'Création éco…');return generateRemote(text,{size,requestId})}
document.getElementById('composer').addEventListener('submit',async e=>{e.preventDefault();const text=promptEl.value.trim();if(!text||busy)return;busy=true;button.disabled=true;qualityEl.disabled=true;button.textContent='Génération…';refsEl.classList.add('hidden');refsTitle.classList.add('hidden');metaEl.classList.add('hidden');const requestId=newRequestId();const size=Number(qualityEl.value)===1024?1024:512;const refsPromise=findReferences(text);try{const out=await generate(text,size,requestId);showImage(out.dataUri||out.imageUrl,text);metaEl.textContent=`${out.provider}${out.model?' · '+out.model:''}${out.degraded?' · secours gratuit':''}`;metaEl.classList.remove('hidden');renderRefs(await refsPromise)}catch(err){console.error(err);status('Échec de génération : '+(err?.message||String(err)),true);renderRefs(await refsPromise)}finally{busy=false;button.disabled=false;qualityEl.disabled=false;button.textContent='Générer l’image'}});
</script>
</body>
</html>
