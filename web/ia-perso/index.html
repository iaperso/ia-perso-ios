<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IA Perso">
<meta name="description" content="IA Perso : un prompt, une image, trois références maximum.">
<link rel="manifest" href="/manifest.webmanifest?v=22">
<title>IA Perso</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#121722;--line:#293247;--text:#f5f7fb;--muted:#99a4b8;--accent:#778cff;--danger:#ff7486;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{min-height:100dvh}.app{width:min(820px,100%);min-height:100dvh;margin:auto;padding:max(22px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}h1{font-size:36px;letter-spacing:-.045em;margin:0}.sub{color:var(--muted);margin:-8px 0 4px;font-size:14px}.composer{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}textarea{width:100%;min-height:145px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:20px;line-height:1.45;padding:8px}textarea::placeholder{color:#747f93}.actions{display:flex;gap:10px;align-items:center}.quality{flex:0 0 auto;background:#0d1119;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit}.generate{flex:1;border:0;border-radius:16px;background:var(--accent);color:white;font:inherit;font-size:18px;font-weight:800;padding:15px 18px}.generate:disabled{opacity:.45}.result{min-height:280px;border:1px solid var(--line);border-radius:22px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.result img{display:block;width:100%;max-height:70dvh;object-fit:contain}.status{padding:24px;text-align:center;color:var(--muted);line-height:1.5}.error{color:var(--danger)}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #4e5a70;border-top-color:#dce3ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.meta{color:var(--muted);font-size:12px;text-align:center;margin-top:-10px}.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ref{display:block;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);color:var(--text);text-decoration:none;min-width:0}.ref img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#0d1119}.ref .caption{padding:8px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.refs-title{font-size:13px;color:var(--muted);margin-bottom:-8px}.hidden{display:none!important}@media(max-width:540px){.app{padding-left:12px;padding-right:12px}h1{font-size:32px}textarea{min-height:125px;font-size:18px}.result{min-height:250px}.quality{max-width:125px}.refs{gap:7px}}
</style>
</head>
<body>
<main class="app">
  <h1>IA Perso</h1>
  <p class="sub">Une demande = une seule génération · jusqu’à 3 références ouvertes.</p>
  <form id="composer" class="composer" action="javascript:void(0)">
    <textarea id="prompt" autocomplete="off" maxlength="1800" placeholder="Ex. Une maison dans la montagne au coucher du soleil"></textarea>
    <div class="actions">
      <select id="quality" class="quality" aria-label="Qualité"><option value="512" selected>Éco · 512</option><option value="1024">HD · 1024</option></select>
      <button id="generate" class="generate" type="button" disabled>Générer l’image</button>
    </div>
  </form>
  <section id="result" class="result" aria-live="polite"><div class="status">Ton image apparaîtra ici.</div></section>
  <div id="meta" class="meta hidden"></div>
  <div id="refsTitle" class="refs-title hidden">Références visuelles proches</div>
  <section id="refs" class="refs hidden" aria-label="Références visuelles"></section>
</main>
<script>
(function(){
'use strict';
var promptEl=document.getElementById('prompt'),qualityEl=document.getElementById('quality'),button=document.getElementById('generate'),resultEl=document.getElementById('result'),refsEl=document.getElementById('refs'),refsTitle=document.getElementById('refsTitle'),metaEl=document.getElementById('meta'),busy=false;
function newRequestId(){try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID().replace(/[^a-zA-Z0-9_-]/g,'')}catch(e){}return (Date.now()+'-'+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9_-]/g,'')}
function status(text,error){resultEl.innerHTML='';var d=document.createElement('div');d.className='status'+(error?' error':'');d.textContent=text;resultEl.appendChild(d)}
function loading(text){resultEl.innerHTML='<div class="status"><span class="spinner"></span>'+text+'</div>'}
function showImage(url,alt){resultEl.innerHTML='';var img=document.createElement('img');img.src=url;img.alt=alt;img.loading='eager';img.decoding='async';img.onerror=function(){status('L’image a été créée mais son chargement a échoué.',true)};resultEl.appendChild(img)}
function setReady(){button.disabled=busy||!promptEl.value.trim()}
promptEl.addEventListener('input',setReady);setReady();
function fetchTimeout(url,opts,ms){return new Promise(function(resolve,reject){var c=new AbortController(),t=setTimeout(function(){c.abort()},ms);fetch(url,Object.assign({},opts||{},{signal:c.signal})).then(resolve,reject).finally(function(){clearTimeout(t)})})}
function generateRemote(text,size,requestId){return fetchTimeout('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,size:size,requestId:requestId})},90000).then(function(r){return r.json().catch(function(){return {}}).then(function(p){if(!r.ok)throw new Error(p.error||('Génération HTTP '+r.status));return p})})}
function renderRefs(refs){refsEl.innerHTML='';if(!refs||!refs.length){refsEl.classList.add('hidden');refsTitle.classList.add('hidden');return}refs.slice(0,3).forEach(function(ref){var a=document.createElement('a');a.className='ref';a.href=ref.landingUrl;a.target='_blank';a.rel='noopener noreferrer';var img=document.createElement('img');img.src=ref.thumbUrl;img.alt=ref.title||'Référence';img.loading='lazy';var cap=document.createElement('div');cap.className='caption';cap.textContent=[ref.creator,ref.license].filter(Boolean).join(' · ')||ref.source||'Openverse';a.appendChild(img);a.appendChild(cap);refsEl.appendChild(a)});refsEl.classList.remove('hidden');refsTitle.classList.remove('hidden')}
function findReferences(q){var u='https://api.openverse.org/v1/images/?q='+encodeURIComponent(q)+'&page_size=3&page=1&mature=false&filter_dead=true';return fetchTimeout(u,{headers:{Accept:'application/json'},referrerPolicy:'no-referrer'},8000).then(function(r){if(!r.ok)throw new Error('Openverse '+r.status);return r.json()}).then(function(p){return (p.results||[]).slice(0,3).map(function(x){return{id:x.id,title:x.title||'Référence visuelle',creator:x.creator||'',source:x.source||x.provider||'Openverse',license:x.license||'',landingUrl:x.foreign_landing_url||x.url||'#',thumbUrl:'https://api.openverse.org/v1/images/'+encodeURIComponent(x.id)+'/thumb/?compressed=true'}})}).catch(function(){return []})}
function run(ev){if(ev&&ev.preventDefault)ev.preventDefault();var text=promptEl.value.trim();if(!text||busy)return;busy=true;setReady();qualityEl.disabled=true;button.textContent='Génération…';refsEl.classList.add('hidden');refsTitle.classList.add('hidden');metaEl.classList.add('hidden');var requestId=newRequestId(),size=Number(qualityEl.value)===1024?1024:512;loading(size===1024?'Création HD…':'Création éco…');findReferences(text).then(renderRefs);generateRemote(text,size,requestId).then(function(out){showImage(out.dataUri||out.imageUrl,text);metaEl.textContent=String(out.provider||'génération')+(out.model?' · '+out.model:'')+(out.degraded?' · secours gratuit':'');metaEl.classList.remove('hidden')}).catch(function(err){status('Échec de génération : '+(err&&err.message?err.message:String(err)),true)}).finally(function(){busy=false;qualityEl.disabled=false;button.textContent='Générer l’image';setReady()})}
button.addEventListener('click',run);document.getElementById('composer').addEventListener('submit',run);
})();
</script>
</body>
</html>
