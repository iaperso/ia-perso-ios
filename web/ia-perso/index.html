<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IA Perso">
<meta name="description" content="IA Perso : génération d’images et préparation de références d’entraînement.">
<link rel="manifest" href="/manifest.webmanifest?v=25">
<title>IA Perso</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#121722;--line:#293247;--text:#f5f7fb;--muted:#99a4b8;--accent:#778cff;--danger:#ff7486;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{min-height:100dvh}.app{width:min(820px,100%);min-height:100dvh;margin:auto;padding:max(22px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}h1{font-size:36px;letter-spacing:-.045em;margin:0}.composer,.training{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}.training-title{font-weight:800;font-size:18px}.training-help{color:var(--muted);font-size:13px;line-height:1.4}textarea{width:100%;min-height:145px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:20px;line-height:1.45;padding:8px}textarea::placeholder{color:#747f93}.caption-input{min-height:90px;border:1px solid var(--line);border-radius:14px;background:#0d1119;font-size:16px;padding:12px}.actions,.training-actions{display:flex;gap:10px;align-items:center}.quality{flex:0 0 auto;background:#0d1119;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit}.generate,.train-btn,.download-btn{border:0;border-radius:16px;background:var(--accent);color:white;font:inherit;font-size:17px;font-weight:800;padding:14px 16px}.generate{flex:1}.train-btn{background:#20283a}.generate:disabled,.download-btn:disabled{opacity:.45}.result{min-height:280px;border:1px solid var(--line);border-radius:22px;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.result img{display:block;width:100%;max-height:70dvh;object-fit:contain}.status{padding:24px;text-align:center;color:var(--muted);line-height:1.5}.error{color:var(--danger)}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #4e5a70;border-top-color:#dce3ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.meta{color:var(--muted);font-size:12px;text-align:center;margin-top:-10px}.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ref{display:block;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);color:var(--text);text-decoration:none;min-width:0}.ref img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#0d1119}.ref .caption{padding:8px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ref .source{display:block;font-weight:700;color:var(--text);margin-bottom:2px}.refs-title{font-size:13px;color:var(--muted);margin-bottom:-8px}.paste-zone{min-height:126px;border:1px dashed #54617b;border-radius:18px;background:#0d1119;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:var(--muted);outline:0}.paste-zone:focus{border-color:var(--accent);color:var(--text)}.paste-zone.has-image{padding:0;border-style:solid;overflow:hidden}.paste-zone img{display:block;width:100%;max-height:55dvh;object-fit:contain}.hidden{display:none!important}@media(max-width:540px){.app{padding-left:12px;padding-right:12px}h1{font-size:32px}textarea{min-height:125px;font-size:18px}.caption-input{min-height:82px;font-size:16px}.result{min-height:250px}.quality{max-width:125px}.refs{gap:7px}.training-actions{flex-direction:column;align-items:stretch}.train-btn,.download-btn{width:100%}}
</style>
</head>
<body>
<main class="app">
  <h1>IA Perso</h1>
  <form id="composer" class="composer" action="javascript:void(0)">
    <textarea id="prompt" autocomplete="off" maxlength="1800" placeholder="Ex. Une maison dans la montagne au coucher du soleil"></textarea>
    <div class="actions">
      <select id="quality" class="quality" aria-label="Qualité"><option value="512" selected>Éco · 512</option><option value="1024">HD · 1024</option></select>
      <button id="generate" class="generate" type="button" disabled>Générer l’image</button>
    </div>
  </form>
  <section id="result" class="result" aria-live="polite"><div class="status">Ton image apparaîtra ici.</div></section>
  <div id="meta" class="meta hidden"></div>
  <div id="refsTitle" class="refs-title hidden">Références visuelles proches · jusqu’à 3 Web + 5 Bluesky</div>
  <section id="refs" class="refs hidden" aria-label="Références visuelles web et Bluesky"></section>
  <section class="training" aria-label="Préparer une image d’entraînement">
    <div class="training-title">Image pour entraînement</div>
    <div class="training-help">Copie une capture ou une photo sur l’iPhone, touche la zone puis « Coller ». Tu peux aussi choisir l’image dans Photos.</div>
    <div id="pasteZone" class="paste-zone" contenteditable="true" role="textbox" aria-label="Coller une image ici" spellcheck="false">Touchez ici puis collez une capture image</div>
    <input id="photoInput" type="file" accept="image/*" class="hidden">
    <div class="training-actions"><button id="choosePhoto" class="train-btn" type="button">Choisir dans Photos</button><button id="useGenerated" class="train-btn" type="button">Utiliser l’image générée</button></div>
    <textarea id="trainingCaption" class="caption-input" maxlength="500" placeholder="Description courte, ex. homme adulte grisonnant, cheveux poivre et sel, barbe grisonnante, torse nu, debout dans une cuisine, corps entier, photographie réaliste"></textarea>
    <button id="downloadTraining" class="download-btn" type="button" disabled>Enregistrer image + légende</button>
  </section>
</main>
<script>
(function(){'use strict';var promptEl=document.getElementById('prompt'),qualityEl=document.getElementById('quality'),button=document.getElementById('generate'),resultEl=document.getElementById('result'),refsEl=document.getElementById('refs'),refsTitle=document.getElementById('refsTitle'),metaEl=document.getElementById('meta'),busy=false;var pasteZone=document.getElementById('pasteZone'),photoInput=document.getElementById('photoInput'),choosePhoto=document.getElementById('choosePhoto'),useGenerated=document.getElementById('useGenerated'),trainingCaption=document.getElementById('trainingCaption'),downloadTraining=document.getElementById('downloadTraining');var trainingFile=null,trainingUrl='',generatedUrl='';function newRequestId(){try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID().replace(/[^a-zA-Z0-9_-]/g,'')}catch(e){}return(Date.now()+'-'+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9_-]/g,'')}function status(text,error){resultEl.innerHTML='';var d=document.createElement('div');d.className='status'+(error?' error':'');d.textContent=text;resultEl.appendChild(d)}function loading(text){resultEl.innerHTML='<div class="status"><span class="spinner"></span>'+text+'</div>'}function showImage(url,alt){generatedUrl=url;resultEl.innerHTML='';var img=document.createElement('img');img.src=url;img.alt=alt;img.loading='eager';img.decoding='async';img.onerror=function(){status('L’image a été créée mais son chargement a échoué.',true)};resultEl.appendChild(img)}function setReady(){button.disabled=busy||!promptEl.value.trim()}promptEl.addEventListener('input',setReady);setReady();function fetchTimeout(url,opts,ms){return new Promise(function(resolve,reject){var c=new AbortController(),t=setTimeout(function(){c.abort()},ms);fetch(url,Object.assign({},opts||{},{signal:c.signal})).then(resolve,reject).finally(function(){clearTimeout(t)})})}function generateRemote(text,size,requestId){return fetchTimeout('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,size:size,requestId:requestId})},90000).then(function(r){return r.json().catch(function(){return{}}).then(function(p){if(!r.ok)throw new Error(p.error||('Génération HTTP '+r.status));return p})})}function findReferences(q){return fetchTimeout('/api/references?q='+encodeURIComponent(q),{headers:{Accept:'application/json'},referrerPolicy:'no-referrer'},8000).then(function(r){if(!r.ok)return[];return r.json().catch(function(){return{results:[]}})}).then(function(p){return Array.isArray(p.results)?p.results.slice(0,8):[]}).catch(function(){return[]})}function renderRefs(refs){refsEl.innerHTML='';if(!refs||!refs.length){refsEl.classList.add('hidden');refsTitle.classList.add('hidden');return}refs.slice(0,8).forEach(function(ref){var a=document.createElement('a');a.className='ref';a.href=ref.landingUrl;a.target='_blank';a.rel='noopener noreferrer';var img=document.createElement('img');img.src=ref.thumbUrl;img.alt=ref.title||'Référence visuelle';img.loading='lazy';img.decoding='async';img.onerror=function(){this.style.display='none'};var cap=document.createElement('div');cap.className='caption';var source=document.createElement('span');source.className='source';source.textContent=ref.sourceType==='bluesky'?'Bluesky':ref.sourceType==='commons'?'Wikimedia Commons':'Google Images';var who=document.createElement('span');who.textContent=ref.creator||ref.source||'';cap.appendChild(source);cap.appendChild(who);a.appendChild(img);a.appendChild(cap);refsEl.appendChild(a)});refsEl.classList.remove('hidden');refsTitle.classList.remove('hidden')}function run(ev){if(ev&&ev.preventDefault)ev.preventDefault();var text=promptEl.value.trim();if(!text||busy)return;busy=true;setReady();qualityEl.disabled=true;button.textContent='Génération…';refsEl.classList.add('hidden');refsTitle.classList.add('hidden');metaEl.classList.add('hidden');var requestId=newRequestId(),size=Number(qualityEl.value)===1024?1024:512;loading(size===1024?'Création HD…':'Création éco…');findReferences(text).then(renderRefs);generateRemote(text,size,requestId).then(function(out){showImage(out.dataUri||out.imageUrl,text);metaEl.textContent=String(out.provider||'génération')+(out.model?' · '+out.model:'')+(out.degraded?' · secours gratuit':'');metaEl.classList.remove('hidden')}).catch(function(err){status('Échec de génération : '+(err&&err.message?err.message:String(err)),true)}).finally(function(){busy=false;qualityEl.disabled=false;button.textContent='Générer l’image';setReady()})}button.addEventListener('click',run);document.getElementById('composer').addEventListener('submit',run);function setTrainingFile(file){if(!file||!String(file.type||'').startsWith('image/'))return;if(trainingUrl&&trainingUrl.startsWith('blob:'))URL.revokeObjectURL(trainingUrl);trainingFile=file;trainingUrl=URL.createObjectURL(file);pasteZone.contentEditable='false';pasteZone.classList.add('has-image');pasteZone.innerHTML='';var img=document.createElement('img');img.src=trainingUrl;img.alt='Image importée pour entraînement';pasteZone.appendChild(img);downloadTraining.disabled=false;if(!trainingCaption.value.trim()&&promptEl.value.trim())trainingCaption.value=promptEl.value.trim()}function dataUriToFile(dataUri){var p=dataUri.split(','),m=(p[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg',b=atob(p[1]||''),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new File([a],'image-generee.'+(m.includes('png')?'png':'jpg'),{type:m})}function onPaste(e){var items=e.clipboardData&&e.clipboardData.items;if(!items)return;for(var i=0;i<items.length;i++){if(items[i].type&&items[i].type.indexOf('image/')===0){e.preventDefault();setTrainingFile(items[i].getAsFile());return}}}pasteZone.addEventListener('paste',onPaste);document.addEventListener('paste',function(e){if(document.activeElement===pasteZone)onPaste(e)});pasteZone.addEventListener('click',function(){if(!trainingFile){pasteZone.contentEditable='true';pasteZone.focus()}});choosePhoto.addEventListener('click',function(){photoInput.click()});photoInput.addEventListener('change',function(){setTrainingFile(photoInput.files&&photoInput.files[0])});useGenerated.addEventListener('click',function(){if(!generatedUrl)return alert('Génère d’abord une image.');if(generatedUrl.indexOf('data:image/')===0)setTrainingFile(dataUriToFile(generatedUrl));else fetch(generatedUrl).then(function(r){return r.blob()}).then(function(b){setTrainingFile(new File([b],'image-generee.'+(b.type.includes('png')?'png':'jpg'),{type:b.type||'image/jpeg'}))}).catch(function(){alert('Impossible de récupérer cette image.')})});function safeName(text){var s=(text||'image-entrainement').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);return s||'image-entrainement'}function downloadBlob(blob,name){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500)}downloadTraining.addEventListener('click',function(){if(!trainingFile)return;var cap=trainingCaption.value.trim(),base=safeName(cap||promptEl.value);downloadBlob(trainingFile,base+'.'+(trainingFile.type.includes('png')?'png':'jpg'));setTimeout(function(){downloadBlob(new Blob([cap],{type:'text/plain;charset=utf-8'}),base+'.txt')},350)});})();
</script>
</body>
</html>
