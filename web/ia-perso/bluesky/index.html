<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>IA Perso · Bluesky</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#121722;--line:#293247;--text:#f5f7fb;--muted:#99a4b8;--accent:#778cff;--danger:#ff7486;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{min-height:100dvh}.app{width:min(1100px,100%);margin:auto;padding:18px 14px 32px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.top a{color:var(--muted);text-decoration:none;font-size:14px}.title{font-size:30px;font-weight:800;letter-spacing:-.04em}.search{display:grid;grid-template-columns:1fr auto auto;gap:10px;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:20px;position:sticky;top:8px;z-index:5}.search input,.search select{border:1px solid var(--line);background:#0d1119;color:var(--text);border-radius:14px;padding:12px;font:inherit;outline:none}.search button,.toolbar button,.card button{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800}.search button:disabled,.toolbar button:disabled{opacity:.45}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:16px 0}.meta{color:var(--muted);font-size:13px}.grid{columns:4 220px;column-gap:12px}.card{break-inside:avoid;margin:0 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.photo{position:relative;background:#0d1119}.photo img{display:block;width:100%;height:auto}.photo button{position:absolute;right:8px;bottom:8px;padding:8px 10px;font-size:12px;background:rgba(15,18,25,.85);backdrop-filter:blur(8px)}.body{padding:11px}.author{display:flex;gap:8px;align-items:center;margin-bottom:8px}.avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#222}.who{min-width:0}.name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.handle{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.text{font-size:13px;line-height:1.4;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.links{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.links a{color:#aebaff;text-decoration:none;font-size:12px}.state{padding:40px 12px;text-align:center;color:var(--muted)}.error{color:var(--danger)}@media(max-width:720px){.search{grid-template-columns:1fr auto}.search select{grid-column:1/2}.search button{grid-column:2/3;grid-row:1/3}.grid{columns:2 150px}.title{font-size:26px}}@media(max-width:420px){.grid{columns:1}.toolbar{align-items:flex-start;flex-direction:column}.toolbar button{width:100%}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="title">Photos Bluesky</div><a href="/">← IA Perso</a></div>
  <form id="searchForm" class="search">
    <input id="query" type="search" maxlength="500" autocomplete="off" placeholder="Ex. chat roux à poils longs" aria-label="Recherche Bluesky">
    <select id="sort" aria-label="Tri"><option value="top">Populaires</option><option value="latest">Récentes</option></select>
    <button id="searchBtn" type="submit">Rechercher</button>
  </form>
  <div class="toolbar"><div id="meta" class="meta">Recherche les publications publiques Bluesky contenant des photos.</div><button id="zipBtn" type="button" disabled>Télécharger tout en ZIP</button></div>
  <section id="grid" class="grid"></section>
  <div id="state" class="state">Entre une recherche pour commencer.</div>
  <button id="moreBtn" type="button" style="display:none;width:100%;margin-top:8px;border:0;background:#20283a;color:#fff;border-radius:16px;padding:14px;font:inherit;font-weight:800">Charger plus</button>
</main>
<script>
(function(){
'use strict';
var form=document.getElementById('searchForm'),query=document.getElementById('query'),sort=document.getElementById('sort'),searchBtn=document.getElementById('searchBtn'),grid=document.getElementById('grid'),state=document.getElementById('state'),meta=document.getElementById('meta'),moreBtn=document.getElementById('moreBtn'),zipBtn=document.getElementById('zipBtn');
var cursor=null,busy=false,posts=[];
function setBusy(v){busy=v;searchBtn.disabled=v;moreBtn.disabled=v;zipBtn.disabled=v||!posts.length}
function fileName(base,index){return(base||'bluesky-photo').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)+'-'+index+'.jpg'}
function downloadUrl(url,name){fetch(url).then(function(r){if(!r.ok)throw new Error('download');return r.blob()}).then(function(blob){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1200)}).catch(function(){window.open(url,'_blank','noopener')})}
function card(post,image,index){var el=document.createElement('article');el.className='card';var photo=document.createElement('div');photo.className='photo';var img=document.createElement('img');img.src=image.thumb||image.fullsize;img.alt=image.alt||post.text||'Photo Bluesky';img.loading='lazy';img.decoding='async';var dl=document.createElement('button');dl.type='button';dl.textContent='Télécharger';dl.onclick=function(){downloadUrl(image.fullsize,fileName(post.author.handle,index+1))};photo.appendChild(img);photo.appendChild(dl);var body=document.createElement('div');body.className='body';var author=document.createElement('div');author.className='author';if(post.author.avatar){var av=document.createElement('img');av.className='avatar';av.src=post.author.avatar;av.alt='';author.appendChild(av)}var who=document.createElement('div');who.className='who';var name=document.createElement('div');name.className='name';name.textContent=post.author.displayName||post.author.handle||'Bluesky';var handle=document.createElement('div');handle.className='handle';handle.textContent=post.author.handle?'@'+post.author.handle:'';who.appendChild(name);who.appendChild(handle);author.appendChild(who);body.appendChild(author);if(post.text){var t=document.createElement('div');t.className='text';t.textContent=post.text;body.appendChild(t)}var links=document.createElement('div');links.className='links';var source=document.createElement('a');source.href=post.landingUrl;source.target='_blank';source.rel='noopener noreferrer';source.textContent='Voir le post';var date=document.createElement('span');date.className='handle';date.textContent=post.createdAt?new Date(post.createdAt).toLocaleDateString('fr-FR'):'';links.appendChild(source);links.appendChild(date);body.appendChild(links);el.appendChild(photo);el.appendChild(body);return el}
function render(newPosts,append){if(!append){grid.innerHTML='';posts=[]}posts=posts.concat(newPosts);newPosts.forEach(function(post){post.images.forEach(function(image,i){grid.appendChild(card(post,image,i))})});var count=posts.reduce(function(n,p){return n+p.images.length},0);meta.textContent=count+' photo'+(count>1?'s':'')+' affichée'+(count>1?'s':'');state.style.display=count?'none':'block';state.textContent=count?'':'Aucune photo trouvée pour cette recherche.';moreBtn.style.display=cursor?'block':'none';zipBtn.disabled=!count}
function search(append){var q=query.value.trim();if(!q||busy)return;if(!append)cursor=null;setBusy(true);state.style.display=append?'none':'block';if(!append)state.textContent='Recherche en cours…';var u='/api/bluesky-search?q='+encodeURIComponent(q)+'&sort='+encodeURIComponent(sort.value)+(cursor?'&cursor='+encodeURIComponent(cursor):'');fetch(u,{headers:{Accept:'application/json'}}).then(function(r){return r.json().then(function(p){if(!r.ok)throw new Error(p.error||'Erreur Bluesky');return p})}).then(function(p){cursor=p.cursor||null;render(Array.isArray(p.posts)?p.posts:[],append)}).catch(function(e){state.style.display='block';state.className='state error';state.textContent=e.message||'Erreur de recherche.'}).finally(function(){state.className='state';setBusy(false)})}
form.addEventListener('submit',function(e){e.preventDefault();search(false)});moreBtn.addEventListener('click',function(){search(true)});
zipBtn.addEventListener('click',async function(){if(!posts.length||typeof JSZip==='undefined')return;setBusy(true);zipBtn.textContent='Création du ZIP…';try{var zip=new JSZip(),folder=zip.folder('bluesky-photos'),n=0;for(var p of posts){for(var image of p.images){n++;try{var r=await fetch(image.fullsize);if(!r.ok)continue;folder.file(fileName(p.author.handle,n),await r.blob())}catch(_){}}var blob=await zip.generateAsync({type:'blob'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bluesky-'+fileName(query.value,1).replace(/-1\.jpg$/,'')+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500)}finally{zipBtn.textContent='Télécharger tout en ZIP';setBusy(false)}});
})();
</script>

</body>
</html>
