<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA Perso · Bluesky</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;background:#080a0e;color:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:18px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:10px;position:sticky;top:8px;background:#121722;border:1px solid #293247;border-radius:18px;padding:10px;z-index:3}input,select,button{font:inherit;border-radius:12px;padding:12px}input,select{background:#0d1119;color:#fff;border:1px solid #293247}button{border:0;background:#778cff;color:#fff;font-weight:800}.toolbar{display:flex;justify-content:space-between;gap:10px;margin:16px 0;color:#99a4b8}.grid{columns:4 220px;column-gap:12px}.card{break-inside:avoid;margin:0 0 12px;background:#121722;border:1px solid #293247;border-radius:16px;overflow:hidden}.card img{width:100%;display:block}.body{padding:10px}.author{font-weight:800;font-size:13px}.handle,.meta{font-size:12px;color:#99a4b8}.text{font-size:13px;line-height:1.4;margin:8px 0}.actions{display:flex;gap:8px}.actions a,.actions button{font-size:12px;text-decoration:none}.state{text-align:center;color:#99a4b8;padding:36px}@media(max-width:720px){.grid{columns:2 150px}.bar{grid-template-columns:1fr auto}.bar select{grid-column:1}.bar button{grid-column:2;grid-row:1/3}}@media(max-width:420px){.grid{columns:1}}</style></head><body><main class="app"><h1>Photos Bluesky</h1><form id="f" class="bar"><input id="q" placeholder="Ex. chat roux à poils longs"><select id="sort"><option value="top">Populaires</option><option value="latest">Récentes</option></select><button>Rechercher</button></form><div class="toolbar"><div id="m">Recherche publique Bluesky</div><button id="zip" disabled>ZIP</button></div><section id="g" class="grid"></section><div id="s" class="state">Entre une recherche.</div><button id="more" style="display:none;width:100%">Charger plus</button></main><script>(()=>{const API='https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts',f=document.querySelector('#f'),q=document.querySelector('#q'),sort=document.querySelector('#sort'),g=document.querySelector('#g'),s=document.querySelector('#s'),m=document.querySelector('#m'),more=document.querySelector('#more'),zip=document.querySelector('#zip');let cursor='',items=[];const postUrl=p=>{const r=(p.uri||'').split('/').pop();return p.author?.handle&&r?`https://bsky.app/profile/${encodeURIComponent(p.author.handle)}/post/${encodeURIComponent(r)}`:''};const imgs=p=>[...(p.embed?.images||[]),...(p.embed?.media?.images||[])].filter(x=>x.thumb||x.fullsize);function add(posts,append){if(!append){g.innerHTML='';items=[]}for(const p of posts){const images=imgs(p);if(!images.length)continue;const rec={p,images};items.push(rec);for(const im of images){const a=document.createElement('article');a.className='card';const image=document.createElement('img');image.src=im.thumb||im.fullsize;image.alt=im.alt||p.record?.text||'Photo Bluesky';const b=document.createElement('div');b.className='body';b.innerHTML=`<div class="author">${p.author?.displayName||p.author?.handle||'Bluesky'}</div><div class="handle">@${p.author?.handle||''}</div><div class="text"></div><div class="actions"><a target="_blank" rel="noopener" href="${postUrl(p)}">Voir le post</a><button type="button">Télécharger</button></div>`;b.querySelector('.text').textContent=p.record?.text||'';b.querySelector('button').onclick=()=>window.open(im.fullsize||im.thumb,'_blank','noopener');a.append(image,b);g.appendChild(a)}}const n=items.reduce((x,r)=>x+r.images.length,0);m.textContent=`${n} photo${n>1?'s':''}`;s.style.display=n?'none':'block';s.textContent=n?'':'Aucune photo trouvée.';zip.disabled=!n;more.style.display=cursor?'block':'none'}async function search(append=false){const text=q.value.trim();if(!text)return;if(!append)cursor='';s.style.display='block';s.textContent='Recherche…';const u=new URL(API);u.searchParams.set('q',text);u.searchParams.set('sort',sort.value);u.searchParams.set('limit','50');if(cursor)u.searchParams.set('cursor',cursor);try{const r=await fetch(u);if(!r.ok)throw new Error('Erreur Bluesky');const data=await r.json();cursor=data.cursor||'';add(data.posts||[],append)}catch(e){s.style.display='block';s.textContent=e.message}}f.onsubmit=e=>{e.preventDefault();search(false)};more.onclick=()=>search(true);zip.onclick=async()=>{if(!items.length||!window.JSZip)return;zip.disabled=true;zip.textContent='Création…';const z=new JSZip(),folder=z.folder('bluesky');let n=0;for(const r of items)for(const im of r.images){try{const resp=await fetch(im.fullsize||im.thumb);if(!resp.ok)continue;folder.file(`photo-${++n}.jpg`,await resp.blob())}catch{}}const blob=await z.generateAsync({type:'blob'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bluesky-photos.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);zip.textContent='ZIP';zip.disabled=false}})();</script></body></html>
